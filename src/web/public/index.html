<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>피플봇 — 채용 콘텐츠 생성기</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { --bg:#F4F1EA; --ink:#2b2b2b; --accent:#c4623d; --line:#e2ddd1; --card:#fffdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.6; }
  header { padding:20px 24px 12px; }
  header h1 { margin:0; font-size:18px; }
  header .sub { font-size:13px; color:#7a756a; margin-top:4px; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; margin-left:8px; }
  .badge.mock { background:#efe6d6; color:#8a6d3b; }
  .badge.live { background:#dff0e6; color:#2f7d52; }
  .tabs { display:flex; gap:6px; padding:0 24px; border-bottom:1px solid var(--line); }
  .tab { font-size:13px; font-weight:600; padding:9px 14px; border:1px solid var(--line); border-bottom:none;
         border-radius:8px 8px 0 0; background:#efe9dc; color:#6b6557; cursor:pointer; }
  .tab.active { background:var(--card); color:var(--ink); position:relative; top:1px; }
  .wrap { display:grid; grid-template-columns:400px 1fr; height:calc(100vh - 110px); }
  .left { padding:18px 22px; border-right:1px solid var(--line); overflow:auto; }
  .right { padding:18px 28px; overflow:auto; }
  label { font-size:13px; font-weight:600; display:block; margin:14px 0 6px; }
  textarea, input[type=text], select { width:100%; padding:11px; border:1px solid var(--line); border-radius:10px;
         background:var(--card); font-size:13px; }
  textarea { min-height:120px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical; }
  textarea.big { min-height:260px; }
  .filerow { margin-top:6px; }
  .filerow input[type=file] { font-size:12px; }
  button { font-size:14px; font-weight:600; padding:11px 16px; border:none; border-radius:10px; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; width:100%; margin-top:16px; }
  .primary:disabled { opacity:.5; cursor:not-allowed; }
  .hint { font-size:12px; color:#9a948a; margin-top:10px; }
  .emptyhint { color:#b3ada1; font-size:14px; }
  .mocknote { background:#fbe5d6; border:1px solid #e8c9a8; color:#8a5a2b; font-size:12.5px;
              padding:8px 12px; border-radius:8px; margin:12px 0 4px; line-height:1.5; }
  .mocknote.live { background:#dff0e6; border-color:#bfe3cc; color:#2f7d52; }
  #result { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 22px; min-height:70%; }
  #result h2 { font-size:16px; border-bottom:1px solid var(--line); padding-bottom:6px; margin-top:24px; }
  #result table { border-collapse:collapse; width:100%; font-size:13px; margin:10px 0; }
  #result th, #result td { border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top; }
  #result th { background:#f6f1e6; }
  #result blockquote { background:#f9f4e8; border-left:3px solid var(--accent); margin:14px 0; padding:10px 14px; border-radius:6px; }
  .status { font-size:12px; color:#9a948a; margin-bottom:8px; }
  .spin { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .searchrow { display:flex; gap:6px; }
  .searchrow input[type=text] { flex:1; }
  .searchrow button { flex:0 0 auto; background:#efe9dc; color:#6b6557; padding:11px 14px; }
  #refPanel { background:#f6f1e6; border:1px solid var(--line); border-radius:12px; padding:2px 20px 14px; margin-bottom:16px; }
  #refPanel .refhead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:14px 2px 6px; }
  #refPanel .refhead strong { font-size:13px; }
  #refPanel .refhead button { font-size:12px; font-weight:600; padding:6px 10px; background:var(--accent); color:#fff; }
  #refPanel table { border-collapse:collapse; width:100%; font-size:12.5px; margin:8px 0; }
  #refPanel th, #refPanel td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  #refPanel h2 { font-size:14px; margin:12px 0 6px; }
  #refPanel a { color:var(--accent); }
  .clearbtn { background:none; border:1px solid var(--line); color:#9a948a; font-size:12px; font-weight:600;
              padding:6px 10px; margin-top:8px; width:auto; }
  .clearbtn:hover { color:#b3402f; border-color:#e6c3bb; }
</style>
</head>
<body>
<header>
  <h1>피플봇 <span id="modeBadge" class="badge mock">mock</span></h1>
  <div class="sub">우리 회사 콘텐츠를 학습해 채용 콘텐츠(JD·인터뷰·소싱·브랜딩)를 생성하세요.</div>
</header>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <section class="left">
    <div id="fields"></div>
    <button id="genBtn" class="primary">생성</button>
  </section>

  <section class="right">
    <div class="status" id="status"></div>
    <div id="refPanel" style="display:none"></div>
    <div id="result"></div>
  </section>
</div>

<script>
const genBtn = document.getElementById("genBtn");
const resultEl = document.getElementById("result");
const statusEl = document.getElementById("status");
const modeBadge = document.getElementById("modeBadge");
const tabsEl = document.getElementById("tabs");
const fieldsEl = document.getElementById("fields");
const refPanel = document.getElementById("refPanel");

let features = [];
let current = null;
const savedJDs = JSON.parse(sessionStorage.getItem("savedJDs") || "[]"); // {title,text}
// 로드 시 같은 제목 중복 제거 (예전에 쌓인 것 정리) — 최신 것만 남김
(() => {
  const seen = new Set();
  for (let i = 0; i < savedJDs.length;) {
    if (seen.has(savedJDs[i].title)) savedJDs.splice(i, 1);
    else { seen.add(savedJDs[i].title); i++; }
  }
  sessionStorage.setItem("savedJDs", JSON.stringify(savedJDs));
})();
let lastJD = savedJDs[0] || null; // 방금 생성한(현재 화면의) 완성본 JD

fetch("/api/status").then(r => r.json()).then(s => {
  if (s.hasKey) { modeBadge.textContent = "live"; modeBadge.className = "badge live"; }
});

fetch("/api/features").then(r => r.json()).then(list => {
  features = list;
  tabsEl.innerHTML = "";
  list.forEach((f, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === 0 ? " active" : "");
    b.textContent = f.label;
    b.dataset.id = f.id;
    b.onclick = () => selectFeature(f.id);
    tabsEl.appendChild(b);
  });
  if (list.length) selectFeature(list[0].id);
});

function selectFeature(id) {
  current = features.find(f => f.id === id);
  if (!current) return;
  [...tabsEl.children].forEach(b => b.classList.toggle("active", b.dataset.id === id));
  renderFields(current);
  showEmptyHint();
  statusEl.textContent = "";
  refPanel.style.display = "none";   // 탭 전환 시 레퍼런스 패널 초기화
  refPanel.innerHTML = "";
}

// 타 회사 JD 레퍼런스 검색 → 오른쪽 별도 패널에 표시
function deriveRoleFromRequest() {
  const pos = fieldsEl.querySelector('[data-name="position"]');
  if (pos && pos.value.trim()) return pos.value.trim();
  const req = fieldsEl.querySelector('[data-name="request"]');
  const m = (req && req.value || "").match(/(직무명?|포지션명?)\s*[:：]\s*(.+)/);
  return m ? m[2].split(/[\n(]/)[0].trim() : "";
}

async function runReferenceSearch(rawQuery) {
  const query = (rawQuery || "").trim() || deriveRoleFromRequest();
  if (!query) { alert("검색할 직무/키워드를 입력하거나, 요청서에 '직무명: ...'을 넣어주세요."); return; }
  refPanel.style.display = "block";
  refPanel.innerHTML = '<p class="status"><span class="spin">⏳</span> 타 회사 JD 레퍼런스 검색 중… (' + query + ')</p>';
  try {
    const r = await fetch("/api/search-reference", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ query })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "검색 실패");
    const head = '<div class="refhead"><strong>' +
      (data.mock ? "🔎 레퍼런스" : "🔎 레퍼런스 (웹검색)") +
      '</strong><button type="button" id="refInsertBtn">↓ 참고 콘텐츠에 넣기</button></div>';
    refPanel.innerHTML = head + marked.parse(data.output);
    const ins = document.getElementById("refInsertBtn");
    if (ins) ins.onclick = () => {
      const ref = fieldsEl.querySelector('[data-name="reference"]');
      if (!ref) { alert("이 탭엔 참고 콘텐츠 칸이 없어요."); return; }
      ref.value = (ref.value ? ref.value + "\n\n" : "") + data.output;
      ins.textContent = "✓ 넣었어요";
    };
  } catch (e) {
    refPanel.innerHTML = '<p style="color:#b3402f">❌ ' + e.message + '</p>';
  }
}

function renderFields(feature) {
  fieldsEl.innerHTML = "";
  const single = feature.inputs.length === 1;
  feature.inputs.forEach(field => {
    const lab = document.createElement("label");
    lab.textContent = field.label;
    fieldsEl.appendChild(lab);

    if (field.type === "text") {
      const inp = document.createElement("input");
      inp.type = "text"; inp.dataset.name = field.name; inp.placeholder = field.placeholder || "";
      fieldsEl.appendChild(inp);
    } else if (field.type === "select") {
      const sel = document.createElement("select");
      sel.dataset.name = field.name;
      sel.innerHTML = (field.options || []).map(o => `<option>${o}</option>`).join("");
      fieldsEl.appendChild(sel);
    } else if (field.type === "jd") {
      const sel = document.createElement("select");
      // 최신순 목록 (제목은 이미 로드 시 중복 제거됨). 기본은 '직접 붙여넣기'(빈 상태) — 자동 채움 안 함.
      const opts = ['<option value="">직접 붙여넣기</option>'];
      opts.push(...savedJDs.map((j, i) => `<option value="${i}">${j.title}</option>`));
      sel.innerHTML = opts.join("");
      const ta = document.createElement("textarea");
      ta.dataset.name = field.name; ta.placeholder = field.placeholder || "";
      sel.onchange = () => { const v = sel.value; ta.value = v === "" ? "" : savedJDs[Number(v)].text; };
      fieldsEl.appendChild(sel);
      if (savedJDs.length) {
        const clr = document.createElement("button");
        clr.type = "button"; clr.className = "clearbtn";
        clr.textContent = "🗑 저장된 JD 목록 비우기 (" + savedJDs.length + ")";
        clr.onclick = () => {
          savedJDs.length = 0;
          sessionStorage.removeItem("savedJDs");
          lastJD = null;
          renderFields(feature); // 이 탭만 다시 그림
        };
        fieldsEl.appendChild(clr);
      }
      fieldsEl.appendChild(ta);
    } else if (field.type === "searchref") {
      const row = document.createElement("div");
      row.className = "searchrow";
      const q = document.createElement("input");   // data-name 없음 → 생성 값에 포함 안 됨
      q.type = "text"; q.placeholder = field.placeholder || "";
      const btn = document.createElement("button");
      btn.type = "button"; btn.textContent = "🔎 검색";
      const run = () => runReferenceSearch(q.value);
      btn.onclick = run;
      q.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } });
      row.appendChild(q); row.appendChild(btn);
      fieldsEl.appendChild(row);
    } else {
      const ta = document.createElement("textarea");
      if (single) ta.className = "big";
      ta.dataset.name = field.name; ta.placeholder = field.placeholder || "";
      fieldsEl.appendChild(ta);
      if (field.allowFile) {
        const row = document.createElement("div");
        row.className = "filerow";
        const file = document.createElement("input");
        file.type = "file"; file.accept = ".txt,.md,text/plain";
        file.onchange = () => {
          const f = file.files[0]; if (!f) return;
          if (!/\.(txt|md)$/i.test(f.name)) { alert("지금은 .txt/.md 만 업로드돼요. PDF는 내용을 복사해 붙여넣어 주세요."); file.value=""; return; }
          const reader = new FileReader();
          reader.onload = () => { ta.value = reader.result; };
          reader.readAsText(f);
        };
        row.appendChild(file);
        fieldsEl.appendChild(row);
      }
    }
  });
}

function collectValues() {
  const v = {};
  fieldsEl.querySelectorAll("[data-name]").forEach(el => { v[el.dataset.name] = el.value; });
  return v;
}

function showEmptyHint() {
  resultEl.innerHTML = '<p class="emptyhint">' +
    (current && current.hint ? current.hint : "왼쪽에 내용을 넣고 '생성'을 누르면 여기에 결과가 나와요.") + '</p>';
}

genBtn.addEventListener("click", async () => {
  if (!current) return;
  const values = collectValues();
  if (!Object.values(values).some(x => x && x.trim())) { alert("내용을 입력해 주세요."); return; }
  genBtn.disabled = true;
  resultEl.innerHTML = '<p class="status"><span class="spin">⏳</span> 생성 중…</p>';
  statusEl.textContent = "";
  try {
    const r = await fetch("/api/generate", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ feature: current.id, values })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "생성 실패");
    const note = data.mock
      ? '<div class="mocknote">📐 구조 이해를 돕기 위한 예시입니다. 실제 맥락을 이해한 콘텐츠는 API 연결 시 생성돼요.</div>'
      : '<div class="mocknote live">✨ <b>live 모드</b> — 실제 Claude 생성 결과예요.</div>';
    resultEl.innerHTML = note + marked.parse(data.output);
    modeBadge.textContent = data.mock ? "mock" : "live";
    modeBadge.className = "badge " + (data.mock ? "mock" : "live");
    if (current.id === "jd") lastJD = saveJD(values, data.output);
  } catch (e) {
    resultEl.innerHTML = '<p style="color:#b3402f">❌ ' + e.message + '</p>';
  } finally {
    genBtn.disabled = false;
  }
});

// 생성한 JD를 세션에 저장 → 면접 질문 탭의 JD 선택 드롭다운에 노출
function saveJD(values, output) {
  let role = (values.position || "").trim();
  if (!role) {
    const m = (values.request || "").match(/(직무명|포지션명?)\s*[:：]\s*(.+)/);
    role = m ? m[2].split(/[\n(]/)[0].trim() : "포지션";
  }
  const title = role + "_JD";
  const entry = { title, text: output };
  // 같은 제목이 이미 있으면 제거 → 최신으로 교체 (목록이 쌓이지 않게)
  for (let i = savedJDs.length - 1; i >= 0; i--) if (savedJDs[i].title === title) savedJDs.splice(i, 1);
  savedJDs.unshift(entry);
  if (savedJDs.length > 10) savedJDs.pop();
  sessionStorage.setItem("savedJDs", JSON.stringify(savedJDs));
  return entry;
}
</script>
</body>
</html>
