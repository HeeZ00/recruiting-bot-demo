services:
  - type: web
    name: recruiting-bot-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # 실제 AI 생성(live)을 켜려면 아래에 키를 넣으세요.
      # ⚠️ 공개 URL에 키를 넣으면 접속자 누구나 호출 → 과금 주의. 데모는 키 없이(mock) 권장.
      # - key: ANTHROPIC_API_KEY
      #   sync: false
